<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shankit.com is available</title>
<meta name="description" content="The domain shankit.com is available for acquisition. Submit an inquiry.">

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8KC2D8KKLK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8KC2D8KKLK');
</script>

<style>
  :root {
    --ink: #1c1f1d;
    --muted: #6b716d;
    --line: #dfe3df;
    --bg: #f7f6f2;
    --card: #ffffff;
    --accent: #2f5d4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }
  main { width: 100%; max-width: 520px; }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }
  h1 {
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0 0 16px;
    line-height: 1;
  }
  p.lede {
    font-size: 18px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0 0 36px;
  }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .opt { font-weight: 400; color: var(--muted); }
  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin: 0 0 18px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  textarea { min-height: 110px; resize: vertical; }
  button {
    width: 100%;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .hidden { position: absolute; left: -9999px; }
  #status { margin: 12px 0 0; font-size: 14px; color: #a33; min-height: 1em; }
  button:disabled { opacity: 0.6; cursor: default; }
  .alt {
    margin: 20px 0 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }
  .alt a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .alt a:hover { text-decoration: underline; }
  footer {
    margin-top: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Premium domain</p>
  <h1>shankit.com</h1>
  <p class="lede">This domain is available for acquisition. Serious inquiries are welcome. Send a note below and the owner will reply directly.</p>

  <form action="https://formspree.io/f/mwlowvnv" method="POST" id="inquiry">
    <input type="hidden" name="_subject" value="shankit.com inquiry">
    <p class="hidden"><label>Leave blank <input name="_gotcha" tabindex="-1" autocomplete="off"></label></p>

    <label for="name">Name</label>
    <input id="name" name="name" type="text" required autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="company">Company <span class="opt">(optional)</span></label>
    <input id="company" name="company" type="text" autocomplete="organization">

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit" id="send">Send inquiry</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>

  <p class="alt">Prefer email? Write to <a href="mailto:domains@shankit.com?subject=shankit.com%20inquiry" id="email-link">domains@shankit.com</a></p>

  <footer>&copy; shankit.com</footer>
</main>

<script>
  // Sends the form to Formspree without leaving the page, and records a GA4 "generate_lead" event
  (function () {
    var form = document.getElementById('inquiry');
    var status = document.getElementById('status');
    var btn = document.getElementById('send');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending...';
      status.textContent = '';
      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(function (r) {
        if (!r.ok) throw new Error('send failed');
        try { gtag('event', 'generate_lead', { form_name: 'inquiry' }); } catch (err) {}
        form.innerHTML = '<p style="margin:0;font-size:16px;line-height:1.5">Thank you. Your inquiry has been received and you will hear back soon.</p>';
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = 'Send inquiry';
        status.textContent = 'Something went wrong. Please try again in a moment.';
      });
    });
  })();

  // Records a GA4 event when someone clicks the email address
  document.getElementById('email-link').addEventListener('click', function () {
    try { gtag('event', 'email_click', { link_text: 'domains@shankit.com' }); } catch (e) {}
  });
</script>
</body>
</html>
